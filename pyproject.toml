[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chest-xray-research"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "CPU-only notebook workflow for chest X-ray classification research"

[tool.setuptools.packages.find]
include = ["ml*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
